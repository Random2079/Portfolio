<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio News</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1419;
        --panel: #1a222c;
        --text: #e7ecf1;
        --muted: #8b9aab;
        --accent: #3d9cf0;
        --border: #2a3542;
        --equity: #3d9cf0;
        --bond: #c9a227;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(1200px 600px at 10% -10%, #1a2a3a 0%, var(--bg) 55%);
        color: var(--text);
        min-height: 100vh;
      }
      .app { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
      header {
        display: flex; flex-wrap: wrap; align-items: baseline;
        justify-content: space-between; gap: 0.75rem; margin-bottom: 1.25rem;
      }
      header h1 { margin: 0; font-size: 1.5rem; }
      header p { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.9rem; }
      .actions { display: flex; gap: 0.5rem; }
      button {
        background: var(--accent); color: #041018; border: none; border-radius: 8px;
        padding: 0.45rem 0.9rem; font-weight: 600; cursor: pointer;
      }
      button:disabled { opacity: 0.5; }
      button.secondary {
        background: transparent; color: var(--text); border: 1px solid var(--border);
      }
      .layout { display: grid; grid-template-columns: 280px 1fr; gap: 1rem; }
      @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
      .panel {
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        border: 1px solid var(--border); border-radius: 12px; padding: 0.75rem;
      }
      .panel h2 {
        margin: 0 0 0.75rem; font-size: 0.95rem; color: var(--muted);
        text-transform: uppercase; letter-spacing: 0.06em;
      }
      .ticker-list { list-style: none; margin: 0; padding: 0; max-height: 70vh; overflow: auto; }
      .ticker-list li button {
        width: 100%; text-align: left; background: transparent; color: var(--text);
        border: none; border-radius: 8px; padding: 0.5rem 0.55rem; font-weight: 500;
        display: flex; flex-direction: column; gap: 0.15rem;
      }
      .ticker-list li button:hover, .ticker-list li button.active { background: #243140; }
      .id { font-family: ui-monospace, Consolas, monospace; font-size: 0.85rem; }
      .name { color: var(--muted); font-size: 0.75rem; }
      .badge {
        display: inline-block; font-size: 0.65rem; text-transform: uppercase;
        padding: 0.1rem 0.35rem; border-radius: 4px; width: fit-content;
      }
      .badge.equity { background: color-mix(in srgb, var(--equity) 25%, transparent); color: var(--equity); }
      .badge.bond { background: color-mix(in srgb, var(--bond) 25%, transparent); color: var(--bond); }
      .news-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.55rem; }
      .news-item {
        padding: 0.75rem; border-radius: 10px; border: 1px solid var(--border); background: #121920;
      }
      .news-item a { color: var(--text); text-decoration: none; font-weight: 600; }
      .news-item a:hover { color: var(--accent); }
      .meta { margin-top: 0.35rem; color: var(--muted); font-size: 0.8rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
      .error { color: #ff8f8f; margin-bottom: 0.75rem; }
      .empty { color: var(--muted); padding: 1rem 0.25rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@19/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@19/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      const { useCallback, useEffect, useMemo, useState } = React;

      async function getJson(path) {
        const res = await fetch(path);
        if (!res.ok) throw new Error(`${res.status} ${path}`);
        return res.json();
      }

      function App() {
        const [tickers, setTickers] = useState([]);
        const [news, setNews] = useState([]);
        const [selected, setSelected] = useState(null);
        const [error, setError] = useState("");
        const [busy, setBusy] = useState(false);
        const [pollInfo, setPollInfo] = useState(null);

        const load = useCallback(async () => {
          setError("");
          try {
            const [t, n] = await Promise.all([
              getJson("/api/tickers"),
              getJson(selected ? `/api/news?ticker=${encodeURIComponent(selected)}&limit=80` : "/api/news?limit=80"),
            ]);
            setTickers(t);
            setNews(n);
          } catch (e) {
            setError(String(e.message || e));
          }
        }, [selected]);

        useEffect(() => { load(); }, [load]);

        const counts = useMemo(() => ({
          equity: tickers.filter((t) => t.kind === "equity").length,
          bond: tickers.filter((t) => t.kind === "bond").length,
        }), [tickers]);

        async function runPoll() {
          setBusy(true);
          setError("");
          try {
            const stats = await fetch("/api/poll?notify=true", { method: "POST" }).then((r) => {
              if (!r.ok) throw new Error(`poll ${r.status}`);
              return r.json();
            });
            setPollInfo(stats);
            await load();
          } catch (e) {
            setError(String(e.message || e));
          } finally {
            setBusy(false);
          }
        }

        return (
          <div className="app">
            <header>
              <div>
                <h1>Portfolio News</h1>
                <p>
                  {tickers.length} бумаг · {counts.equity} акций · {counts.bond} облигаций
                  {pollInfo ? ` · last poll +${pollInfo.inserted}` : ""}
                </p>
              </div>
              <div className="actions">
                <button type="button" className="secondary" onClick={() => setSelected(null)}>Все</button>
                <button type="button" className="secondary" onClick={load} disabled={busy}>Обновить</button>
                <button type="button" onClick={runPoll} disabled={busy}>{busy ? "Опрос…" : "Опросить сейчас"}</button>
              </div>
            </header>
            {error ? <div className="error">API: {error}</div> : null}
            <div className="layout">
              <aside className="panel">
                <h2>Тикеры</h2>
                <ul className="ticker-list">
                  {tickers.map((t) => (
                    <li key={t.id}>
                      <button type="button" className={selected === t.id ? "active" : ""} onClick={() => setSelected(t.id)}>
                        <span className={`badge ${t.kind}`}>{t.kind}</span>
                        <span className="id">{t.id}</span>
                        <span className="name">{t.name}</span>
                      </button>
                    </li>
                  ))}
                </ul>
              </aside>
              <main className="panel">
                <h2>{selected ? `Новости · ${selected}` : "Лента"}</h2>
                {news.length === 0 ? (
                  <div className="empty">Пока пусто. Нажми «Опросить сейчас».</div>
                ) : (
                  <ul className="news-list">
                    {news.map((n) => (
                      <li key={n.id} className="news-item">
                        <a href={n.url} target="_blank" rel="noreferrer">{n.title}</a>
                        <div className="meta">
                          <span>{n.ticker_id}</span>
                          <span>{n.source}</span>
                          <span>{n.published_at ? new Date(n.published_at).toLocaleString("ru-RU") : "—"}</span>
                        </div>
                      </li>
                    ))}
                  </ul>
                )}
              </main>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
