<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio News</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7fb;
        --panel: #ffffff;
        --text: #1a2330;
        --muted: #5c6b7a;
        --accent: #1a6fd4;
        --border: #d5dee8;
        --equity: #1a6fd4;
        --bond: #9a6b12;
        --fund: #0f7a5a;
        --hover: #eaf1f8;
        --card: #f8fafc;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: linear-gradient(165deg, #e8f0f8 0%, var(--bg) 40%, #eef3f8 100%);
        color: var(--text);
        min-height: 100vh;
      }
      .app { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
      header {
        display: flex; flex-wrap: wrap; align-items: baseline;
        justify-content: space-between; gap: 0.75rem; margin-bottom: 0.75rem;
      }
      header h1 { margin: 0; font-size: 1.5rem; }
      header p { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.9rem; }
      .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      button {
        background: var(--accent); color: #fff; border: none; border-radius: 8px;
        padding: 0.45rem 0.9rem; font-weight: 600; cursor: pointer;
      }
      button:disabled { opacity: 0.5; }
      button.secondary {
        background: var(--panel); color: var(--text); border: 1px solid var(--border);
      }
      button.active-filter {
        background: var(--accent); color: #fff; border-color: var(--accent);
      }
      .filters {
        display: flex; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 0.65rem;
      }
      .filters .chip {
        background: var(--panel); color: var(--text); border: 1px solid var(--border);
        border-radius: 999px; padding: 0.35rem 0.85rem; font-weight: 600; font-size: 0.85rem;
      }
      .filters .chip.active-filter { background: var(--accent); color: #fff; border-color: var(--accent); }
      .sectors {
        display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 1rem;
      }
      .sectors .chip {
        background: #fff; color: var(--muted); border: 1px solid var(--border);
        border-radius: 999px; padding: 0.28rem 0.7rem; font-size: 0.78rem; font-weight: 600;
      }
      .sectors .chip.active-filter { background: #1a2330; color: #fff; border-color: #1a2330; }
      .sectors[hidden] { display: none; }
      .layout {
        display: grid;
        grid-template-columns: minmax(240px, 300px) 1fr;
        gap: 1rem;
        align-items: start;
      }
      @media (max-width: 800px) {
        .layout { grid-template-columns: 1fr; }
      }
      .panel {
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 12px; padding: 0.75rem;
        box-shadow: 0 1px 2px rgb(26 35 48 / 4%);
        min-height: 0;
      }
      .panel.news-panel { min-height: 420px; }
      .panel h2 {
        margin: 0 0 0.75rem; font-size: 0.95rem; color: var(--muted);
        text-transform: uppercase; letter-spacing: 0.06em;
      }
      .ticker-list { list-style: none; margin: 0; padding: 0; max-height: 70vh; overflow: auto; }
      .ticker-list li button {
        width: 100%; text-align: left; background: transparent; color: var(--text);
        border: none; border-radius: 8px; padding: 0.5rem 0.55rem; font-weight: 500;
        display: flex; flex-direction: column; gap: 0.15rem;
      }
      .ticker-list li button:hover, .ticker-list li button.active { background: var(--hover); }
      .id { font-family: ui-monospace, Consolas, monospace; font-size: 0.85rem; }
      .name { color: var(--muted); font-size: 0.75rem; }
      .badge {
        display: inline-block; font-size: 0.65rem; text-transform: uppercase;
        padding: 0.1rem 0.35rem; border-radius: 4px; width: fit-content;
      }
      .badge.equity { background: #e8f2fc; color: var(--equity); }
      .badge.bond { background: #f7efd9; color: var(--bond); }
      .badge.fund { background: #e3f5ef; color: var(--fund); }
      .news-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.55rem; }
      .news-item {
        padding: 0.75rem; border-radius: 10px; border: 1px solid var(--border); background: var(--card);
      }
      .news-item a { color: var(--text); text-decoration: none; font-weight: 600; }
      .news-item a:hover { color: var(--accent); }
      .meta { margin-top: 0.35rem; color: var(--muted); font-size: 0.8rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
      .error { color: #b42318; margin-bottom: 0.75rem; }
      .empty { color: var(--muted); padding: 1rem 0.25rem; }
      .progress {
        display: none; margin-bottom: 0.85rem; padding: 0.65rem 0.85rem;
        border: 1px solid var(--border); border-radius: 10px; background: #fff;
      }
      .progress.visible { display: block; }
      .progress .bar {
        height: 8px; border-radius: 999px; background: #e5edf5; overflow: hidden; margin-top: 0.4rem;
      }
      .progress .bar > span {
        display: block; height: 100%; width: 0%; background: var(--accent); transition: width 0.2s;
      }
      .progress .label { font-size: 0.85rem; color: var(--muted); }
      .view-tabs { display: flex; gap: 0.4rem; margin-bottom: 0.75rem; }
      .metrics-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
      .metrics-table th, .metrics-table td {
        text-align: left; padding: 0.45rem 0.35rem; border-bottom: 1px solid var(--border);
      }
      .metrics-table th { color: var(--muted); font-weight: 600; }
      .chg-up { color: #0f7a5a; }
      .chg-down { color: #b42318; }
      .warn-all {
        font-size: 0.8rem; color: var(--muted); margin: 0 0 0.75rem;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div>
          <h1>Portfolio News</h1>
          <p id="subtitle">Загрузка…</p>
        </div>
        <div class="actions">
          <button type="button" class="secondary" id="btnRefresh">Обновить</button>
          <button type="button" class="secondary" id="btnMetrics">Метрики MOEX</button>
          <button type="button" id="btnPoll">Опросить сейчас</button>
        </div>
      </header>

      <div class="filters" id="kindFilters" role="tablist" aria-label="Тип бумаг"></div>
      <div class="sectors" id="sectorFilters" hidden></div>
      <p class="warn-all" id="pollScopeHint"></p>
      <div class="progress" id="progressBox">
        <div class="label" id="progressLabel">Опрос…</div>
        <div class="bar"><span id="progressBar"></span></div>
      </div>

      <div id="error" class="error" hidden></div>
      <div class="view-tabs">
        <button type="button" class="chip active-filter" id="tabNews">Лента</button>
        <button type="button" class="chip" id="tabMetrics">Метрики</button>
      </div>
      <div class="layout" id="newsLayout">
        <aside class="panel">
          <h2 id="tickersHeading">Тикеры</h2>
          <ul class="ticker-list" id="tickers"></ul>
        </aside>
        <main class="panel news-panel">
          <h2 id="newsTitle">Лента</h2>
          <ul class="news-list" id="news"></ul>
        </main>
      </div>
      <div class="panel" id="metricsLayout" hidden>
        <h2>Метрики (MOEX ISS)</h2>
        <div id="metricsBody" class="empty">Нажми «Метрики MOEX» — подтянем цены по текущему фильтру.</div>
      </div>
    </div>
    <script>
      const KIND_LABEL = { all: "Все", equity: "Акции", bond: "Облигации", fund: "Фонды" };
      const KIND_BADGE = { equity: "акция", bond: "облигация", fund: "фонд" };

      let selected = null;
      let kindFilter = "all";
      let sectorFilter = null;
      let tickers = [];
      let allNews = [];
      let pollInfo = null;
      let pollTimer = null;
      let view = "news"; // news | metrics

      function showError(msg) {
        const el = document.getElementById("error");
        if (!msg) {
          el.hidden = true;
          el.textContent = "";
          return;
        }
        el.hidden = false;
        el.textContent = "API: " + msg;
      }

      async function getJson(path) {
        const res = await fetch(path);
        if (!res.ok) throw new Error(res.status + " " + path);
        return res.json();
      }

      function filteredTickers() {
        let list = tickers;
        if (kindFilter !== "all") list = list.filter((t) => t.kind === kindFilter);
        if (kindFilter === "equity" && sectorFilter) {
          list = list.filter((t) => (t.category || "") === sectorFilter);
        }
        return list;
      }

      function pollQuery() {
        const params = new URLSearchParams();
        params.set("notify", "digest");
        if (selected) {
          params.set("ticker_id", selected);
          return params;
        }
        if (kindFilter !== "all") params.set("kind", kindFilter);
        if (kindFilter === "equity" && sectorFilter) params.set("category", sectorFilter);
        return params;
      }

      function updateScopeHint() {
        const el = document.getElementById("pollScopeHint");
        const n = selected ? 1 : filteredTickers().length;
        if (selected) {
          el.textContent = "Опрос: только " + selected;
        } else if (kindFilter === "all" && !sectorFilter) {
          el.textContent = "Опрос: все " + n + " бумаг (долго). Лучше выбрать акции/сектор/тикер.";
        } else {
          el.textContent = "Опрос: текущий фильтр · " + n + " бумаг";
        }
      }

      function equitySectors() {
        const set = new Set();
        for (const t of tickers) {
          if (t.kind === "equity" && t.category) set.add(t.category);
        }
        return Array.from(set).sort((a, b) => a.localeCompare(b, "ru"));
      }

      function setProgress(visible, label, ratio) {
        const box = document.getElementById("progressBox");
        const bar = document.getElementById("progressBar");
        const lab = document.getElementById("progressLabel");
        box.classList.toggle("visible", !!visible);
        lab.textContent = label || "";
        bar.style.width = Math.max(0, Math.min(100, (ratio || 0) * 100)) + "%";
      }

      function renderKindFilters() {
        const host = document.getElementById("kindFilters");
        host.innerHTML = "";
        for (const key of ["all", "equity", "bond", "fund"]) {
          const count =
            key === "all" ? tickers.length : tickers.filter((t) => t.kind === key).length;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "chip" + (kindFilter === key ? " active-filter" : "");
          btn.textContent = KIND_LABEL[key] + " (" + count + ")";
          btn.addEventListener("click", () => {
            kindFilter = key;
            sectorFilter = null;
            if (selected && !filteredTickers().some((t) => t.id === selected)) selected = null;
            renderAll();
          });
          host.appendChild(btn);
        }
      }

      function renderSectorFilters() {
        const host = document.getElementById("sectorFilters");
        if (kindFilter !== "equity") {
          host.hidden = true;
          host.innerHTML = "";
          return;
        }
        host.hidden = false;
        host.innerHTML = "";
        const allBtn = document.createElement("button");
        allBtn.type = "button";
        allBtn.className = "chip" + (!sectorFilter ? " active-filter" : "");
        allBtn.textContent = "Все сектора";
        allBtn.addEventListener("click", () => {
          sectorFilter = null;
          if (selected && !filteredTickers().some((t) => t.id === selected)) selected = null;
          renderAll();
        });
        host.appendChild(allBtn);
        for (const sec of equitySectors()) {
          const n = tickers.filter((t) => t.kind === "equity" && t.category === sec).length;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "chip" + (sectorFilter === sec ? " active-filter" : "");
          btn.textContent = sec + " (" + n + ")";
          btn.addEventListener("click", () => {
            sectorFilter = sec;
            if (selected && !filteredTickers().some((t) => t.id === selected)) selected = null;
            renderAll();
          });
          host.appendChild(btn);
        }
      }

      function renderTickers() {
        const ul = document.getElementById("tickers");
        const list = filteredTickers();
        document.getElementById("tickersHeading").textContent = "Тикеры · " + list.length;
        ul.innerHTML = "";
        if (!list.length) {
          ul.innerHTML = '<li class="empty">В этом фильтре пусто.</li>';
          return;
        }
        for (const t of list) {
          const li = document.createElement("li");
          const btn = document.createElement("button");
          btn.type = "button";
          if (selected === t.id) btn.classList.add("active");
          btn.innerHTML =
            '<span class="badge ' + t.kind + '">' + (KIND_BADGE[t.kind] || t.kind) + "</span>" +
            '<span class="id">' + t.id + "</span>" +
            '<span class="name">' + (t.name || "") +
            (t.kind === "equity" && t.category ? " · " + t.category : "") + "</span>";
          btn.addEventListener("click", () => {
            selected = selected === t.id ? null : t.id;
            renderAll();
          });
          li.appendChild(btn);
          ul.appendChild(li);
        }
      }

      function visibleNews() {
        if (selected) return allNews.filter((n) => n.ticker_id === selected);
        const ids = new Set(filteredTickers().map((t) => t.id));
        if (kindFilter === "all" && !sectorFilter) return allNews;
        return allNews.filter((n) => ids.has(n.ticker_id));
      }

      function renderNews() {
        const items = visibleNews();
        const ul = document.getElementById("news");
        const title = document.getElementById("newsTitle");
        if (selected) title.textContent = "Новости · " + selected;
        else if (kindFilter === "equity" && sectorFilter)
          title.textContent = "Лента · акции · " + sectorFilter;
        else if (kindFilter !== "all")
          title.textContent = "Лента · " + KIND_LABEL[kindFilter].toLowerCase();
        else title.textContent = "Лента";
        ul.innerHTML = "";
        if (!items.length) {
          ul.innerHTML = '<li class="empty">Пока пусто. Нажми «Опросить сейчас» (по текущему фильтру).</li>';
          return;
        }
        for (const n of items) {
          const li = document.createElement("li");
          li.className = "news-item";
          const when = n.published_at ? new Date(n.published_at).toLocaleString("ru-RU") : "—";
          li.innerHTML =
            '<a href="' + n.url + '" target="_blank" rel="noreferrer"></a>' +
            '<div class="meta"><span></span><span></span><span></span></div>';
          li.querySelector("a").textContent = n.title;
          const spans = li.querySelectorAll(".meta span");
          spans[0].textContent = n.ticker_id;
          spans[1].textContent = n.source;
          spans[2].textContent = when;
          ul.appendChild(li);
        }
      }

      function renderSubtitle() {
        const equity = tickers.filter((t) => t.kind === "equity").length;
        const bond = tickers.filter((t) => t.kind === "bond").length;
        const fund = tickers.filter((t) => t.kind === "fund").length;
        let text =
          tickers.length + " бумаг · " + equity + " акций · " + bond + " облигаций · " + fund + " фондов";
        if (pollInfo && pollInfo.inserted != null) text += " · last poll +" + pollInfo.inserted;
        document.getElementById("subtitle").textContent = text;
      }

      function setView(next) {
        view = next;
        document.getElementById("newsLayout").hidden = view !== "news";
        document.getElementById("metricsLayout").hidden = view !== "metrics";
        document.getElementById("tabNews").classList.toggle("active-filter", view === "news");
        document.getElementById("tabMetrics").classList.toggle("active-filter", view === "metrics");
      }

      function fmtNum(v, digits) {
        if (v == null || Number.isNaN(v)) return "—";
        return Number(v).toFixed(digits);
      }

      function renderMetrics(rows) {
        const host = document.getElementById("metricsBody");
        if (!rows || !rows.length) {
          host.className = "empty";
          host.textContent = "Нет данных по фильтру.";
          return;
        }
        host.className = "";
        let html =
          "<table class='metrics-table'><thead><tr>" +
          "<th>Тикер</th><th>Цена</th><th>Δ%</th><th>Див%</th><th>Купон%</th><th>Board</th>" +
          "</tr></thead><tbody>";
        for (const m of rows) {
          const chgClass = m.changepct > 0 ? "chg-up" : m.changepct < 0 ? "chg-down" : "";
          html +=
            "<tr><td><strong>" + m.ticker_id + "</strong><br><span class='name'>" + (m.name || "") +
            "</span></td><td>" + fmtNum(m.last, 2) +
            "</td><td class='" + chgClass + "'>" + fmtNum(m.changepct, 2) +
            "</td><td>" + fmtNum(m.div_yield, 2) +
            "</td><td>" + fmtNum(m.coupon_percent, 2) +
            "</td><td>" + (m.board || "—") + (m.error ? " !" : "") +
            "</td></tr>";
        }
        html += "</tbody></table>";
        host.innerHTML = html;
      }

      function renderAll() {
        renderKindFilters();
        renderSectorFilters();
        renderTickers();
        renderNews();
        renderSubtitle();
        updateScopeHint();
      }

      async function load() {
        showError("");
        try {
          const [t, n] = await Promise.all([
            getJson("/api/tickers"),
            getJson("/api/news?limit=200"),
          ]);
          tickers = t;
          allNews = n;
          if (selected && !tickers.some((x) => x.id === selected)) selected = null;
          renderAll();
        } catch (e) {
          showError(String(e.message || e));
          document.getElementById("subtitle").textContent = "Нет связи с API";
        }
      }

      async function loadMetrics() {
        showError("");
        setView("metrics");
        const host = document.getElementById("metricsBody");
        host.className = "empty";
        host.textContent = "Грузим MOEX…";
        try {
          const params = new URLSearchParams();
          if (selected) params.set("ticker_id", selected);
          else {
            if (kindFilter !== "all") params.set("kind", kindFilter);
            if (kindFilter === "equity" && sectorFilter) params.set("category", sectorFilter);
          }
          // Cap "all" to avoid 50 slow ISS calls in one click
          if (!selected && kindFilter === "all" && !sectorFilter) params.set("limit", "15");
          const rows = await getJson("/api/metrics?" + params.toString());
          renderMetrics(rows);
        } catch (e) {
          showError(String(e.message || e));
          host.textContent = "Ошибка метрик.";
        }
      }

      async function watchPollStatus() {
        const btn = document.getElementById("btnPoll");
        const st = await getJson("/api/poll/status");
        const total = st.total || 0;
        const cur = st.current || 0;
        const ratio = total ? cur / total : st.running ? 0.05 : 1;
        const label = st.running
          ? "Опрос " + (st.ticker_id || "…") + " · " + cur + "/" + total + " · +" + (st.inserted || 0)
          : st.done
            ? "Готово · +" + (st.inserted || 0)
            : "";
        setProgress(st.running || (st.done && label), label, ratio);
        if (st.running) {
          btn.disabled = true;
          btn.textContent = "Опрос…";
          return;
        }
        btn.disabled = false;
        btn.textContent = "Опросить сейчас";
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
        if (st.done) {
          pollInfo = st.result || { inserted: st.inserted };
          setTimeout(() => setProgress(false, "", 0), 1500);
          await load();
        }
      }

      document.getElementById("btnRefresh").addEventListener("click", () => load());
      document.getElementById("btnMetrics").addEventListener("click", () => loadMetrics());
      document.getElementById("tabNews").addEventListener("click", () => setView("news"));
      document.getElementById("tabMetrics").addEventListener("click", () => loadMetrics());
      document.getElementById("btnPoll").addEventListener("click", async () => {
        const btn = document.getElementById("btnPoll");
        const n = selected ? 1 : filteredTickers().length;
        if (!selected && kindFilter === "all" && !sectorFilter && n > 20) {
          if (!confirm("Опросить все " + n + " бумаг? Это долго. Лучше выбрать фильтр.")) return;
        }
        btn.disabled = true;
        btn.textContent = "Опрос…";
        showError("");
        setProgress(true, "Старт…", 0);
        try {
          const q = pollQuery();
          const res = await fetch("/api/poll?" + q.toString(), { method: "POST" });
          // 409 = уже идёт опрос — просто подключаемся к прогрессу, не орём
          if (res.status === 409) {
            showError("");
            setProgress(true, "Уже идёт опрос — следим…", 0);
          } else if (!res.ok) {
            let detail = "poll " + res.status;
            try {
              const body = await res.json();
              if (body && body.detail) detail += " · " + JSON.stringify(body.detail);
            } catch (_) {}
            throw new Error(detail);
          }
          if (pollTimer) clearInterval(pollTimer);
          pollTimer = setInterval(() => {
            watchPollStatus().catch((e) => showError(String(e.message || e)));
          }, 500);
          await watchPollStatus();
          return;
        } catch (e) {
          showError(String(e.message || e));
          btn.disabled = false;
          btn.textContent = "Опросить сейчас";
          setProgress(false, "", 0);
        }
      });

      load();
    </script>
  </body>
</html>
